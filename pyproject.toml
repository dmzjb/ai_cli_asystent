[project]
name = "CLI_AI_ASSISTANT"
version = "0.1.0"
description = "Console AI assistant built with Pydantic AI: tools, persistent history, structured summary, Logfire tracing"
readme = "README.md"
authors = [
    { name = "dmzjb", email = "kubadomowicz2@wp.pl" }
]
requires-python = ">=3.14"
dependencies = [
    "logfire>=5.1.1",
    "pydantic-ai>=2.54.0",
    "pydantic-settings>=2.15.0",
    "ruff>=0.16.10",
]

[project.scripts]
cli-ai-assistant = "cli_ai_assistant.main:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
